name: Build MyGestures deb

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bash curl sudo fakeroot rsync git perl xz-utils unzip

      - name: Install Theos
        run: bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Ensure iPhoneOS 16.5 SDK
        run: |
          if [ ! -d "$HOME/theos/sdks/iPhoneOS16.5.sdk" ]; then
            echo "[*] sparse-clone iPhoneOS16.5.sdk"
            TMP=$(mktemp -d)
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$TMP/sdks"
            cd "$TMP/sdks"
            git sparse-checkout set iPhoneOS16.5.sdk
            mkdir -p "$HOME/theos/sdks"
            cp -R iPhoneOS16.5.sdk "$HOME/theos/sdks/"
          else
            echo "[*] SDK 16.5 already present"
          fi

      - name: Build rootless deb
        run: |
          export THEOS="$HOME/theos"
          export THEOS_PACKAGE_SCHEME=rootless
          make package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: MyGestures-deb
          path: packages/*.deb
